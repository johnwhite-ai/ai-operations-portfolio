// Retake drill - you spawn CT, 3 T bots hold the site
exec _base
mp_roundtime 60
mp_roundtime_defuse 60
mp_c4timer 40
mp_ct_default_primary "weapon_m4a1"
mp_ct_default_secondary "weapon_hkp2000"
mp_t_default_primary "weapon_ak47"
mp_t_default_secondary "weapon_glock"
bot_difficulty 2
bot_quota_mode normal
bot_kick
bot_quota 3
bot_add_t
bot_add_t
bot_add_t
bot_stop 0
bot_defer_to_human_goals 1
bot_allow_grenades 1
bot_allow_rogues 0
mp_restartgame 1
echo ===== RETAKE DRILL LOADED =====
echo Switch to CT (jointeam 3) and walk to site to retake.
echo Numpad + to restart, numpad - to re-add bots.
