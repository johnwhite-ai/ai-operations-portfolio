// Aim warmup - DM-style with bots, infinite ammo, instant respawn
exec _base
mp_roundtime 60
mp_freezetime 0
mp_respawn_on_death_ct 1
mp_respawn_on_death_t 1
mp_respawn_immunitytime 0
sv_infinite_ammo 1
mp_buy_anywhere 1
mp_ct_default_primary "weapon_m4a1"
mp_t_default_primary "weapon_ak47"
bot_difficulty 2
bot_quota_mode fill
bot_kick
bot_quota 5
mp_restartgame 1
echo ===== AIM WARMUP LOADED =====
echo Free-for-all style. Infinite ammo, instant respawn.
